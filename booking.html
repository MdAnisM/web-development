
<!DOCTYPE html>
<html lang="en">
<head>
    <title>IPL | TICKET BOOKINGS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Matches</a></li>
                <li><a href="booking.html">Book ticket</a></li>
                <li><a href="#">My Bookings</a></li>
                <li><a href="index.html#guide">Guidelines</a></li>
            </ul>
        </nav>
    </header>

    <section id="booking">
        <h2>Ticket Booking</h2>

        <form id="bookings">
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter The Full Name" required>
            <br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" placeholder="Enter The Email Address" required>
            <br><br>

            <label for="pnumber">Phone Number:</label>
            <input type="tel" id="pnumber" placeholder="Enter The Phone Number" required>
            <br><br>

            <label for="tickets">Number of Tickets:</label>
            <input type="number" id="tickets" placeholder="Enter The Number of Tickets" required>
            <br><br>

            <label for="stand">Select Stand:</label>
            <select name="stand" id="stand" required>
                <option value="">Select stand</option>
                <option>General</option>
                <option>Premium</option>
                <option>VIP</option>
            </select>
            <br><br>

            <button type="submit">Book Ticket</button>
        </form>
    </section>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>

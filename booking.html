<section id="booking">
                <h2>Ticket Booking </h2>
                <form id="bookings">
                    <label for="name">Full Name:</label>
                    <input type="text" placeholder="Enter The Full Name " required>
                    </br> </br>
                    <label for="email">Email Address:</label>
                    <input type="email" placeholder="Enter The Email Address " required>
                    </br> </br>
                    <label for="pnumber">Phone Number:</label>
                    <input type="tel" placeholder="Enter The Phone Number " required>
                    </br> 
                    </br> 
                    <label for="tickets">Number of Tickets:</label>
                    <input type="number" placeholder="Enter The Number of Tickets " required>
                    </br> 
                    </br> 
                    <label for="stand">Select Stand:</label>
                    <select name="stand" required>
                        <option >select stand</option>
                        <option>General</option>
                        <option>Premium</option>
                        <option>VIP</option>
                    </select>
                    </br> 
                    </br>
                    <button type="submit">Book Ticket</button>
                </form>
            </section>
